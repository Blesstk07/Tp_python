<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock · Gestion de stock</title>
  <style>
    :root {
      --fond: #f5f6f4;
      --surface: #ffffff;
      --texte: #1d2521;
      --texte-doux: #5b665f;
      --bordure: #d9dedb;
      --accent: #1f5e4b;
      --ok-fond: #e1f1e8;   --ok-texte: #1b5a3a;
      --bas-fond: #fdf0d2;  --bas-texte: #7a5200;
      --rupture-fond: #f9dedc; --rupture-texte: #8c1f17;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #151a17;
        --surface: #1e2521;
        --texte: #e8ece9;
        --texte-doux: #9aa6a0;
        --bordure: #333d37;
        --accent: #6fc2a3;
        --ok-fond: #1d3a2b;   --ok-texte: #8fdbb2;
        --bas-fond: #43350f;  --bas-texte: #f0cf7a;
        --rupture-fond: #4a1f1c; --rupture-texte: #f4a8a1;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--fond);
      color: var(--texte);
      line-height: 1.5;
    }
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--bordure);
      padding: 0 1.5rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
      overflow-x: auto;
    }
    nav strong { padding: 1rem 0; white-space: nowrap; }
    nav a {
      color: var(--texte-doux);
      text-decoration: none;
      padding: 1rem 0;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    nav a:hover { color: var(--texte); }
    nav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    .sous-titre { color: var(--texte-doux); margin: 0 0 1.25rem; }
    .barre {
      display: flex; flex-wrap: wrap; gap: 1rem;
      align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .barre label { display: flex; gap: .5rem; align-items: center; cursor: pointer; }
    button {
      font: inherit; cursor: pointer;
      background: var(--accent); color: var(--surface);
      border: 0; border-radius: 6px; padding: .5rem 1rem;
    }
    button:hover { opacity: .9; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tableau-conteneur {
      background: var(--surface);
      border: 1px solid var(--bordure);
      border-radius: 8px;
      overflow-x: auto;
    }
    .formulaire-approvisionnement {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: .75rem;
      align-items: end;
      background: var(--surface);
      border: 1px solid var(--bordure);
      border-radius: 8px;
      padding: 1rem;
    }
    .formulaire-approvisionnement label { display: grid; gap: .25rem; }
    .formulaire-approvisionnement input {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      padding: .5rem;
      border: 1px solid var(--bordure);
      border-radius: 4px;
      background: var(--fond);
      color: var(--texte);
      font: inherit;
    }
    #resultat-approvisionnement { grid-column: 1 / -1; margin: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .75rem 1rem; text-align: left; border-bottom: 1px solid var(--bordure); }
    th { font-size: .875rem; color: var(--texte-doux); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .nombre { text-align: right; font-variant-numeric: tabular-nums; }
    .badge {
      display: inline-block; padding: .125rem .625rem;
      border-radius: 999px; font-size: .8125rem; font-weight: 600;
    }
    .badge.OK { background: var(--ok-fond); color: var(--ok-texte); }
    .badge.LOW { background: var(--bas-fond); color: var(--bas-texte); }
    .badge.OUT { background: var(--rupture-fond); color: var(--rupture-texte); }
    .message { padding: 1.5rem 1rem; text-align: center; color: var(--texte-doux); }
    .message.erreur { color: var(--rupture-texte); }
    #total { color: var(--texte-doux); font-size: .875rem; margin-top: .75rem; }
  </style>
</head>
<body>
  <nav>
    <strong>Gestion de stock</strong>
    <a href="/app/index.html">Accueil</a>
    <a href="/app/products.html">Produits</a>
    <a href="/app/categories.html">Catégories</a>
    <a href="/app/suppliers.html">Fournisseurs</a>
    <a href="/app/stock.html" aria-current="page">Stock</a>
    <a href="/app/sales.html">Ventes</a>
  </nav>
 
  <main>
    <h1>État du stock</h1>
    <p class="sous-titre">Quantités disponibles et alertes de réapprovisionnement.</p>
 
    <div class="barre">
      <label>
        <input type="checkbox" id="filtre-bas">
        Afficher seulement le stock bas ou épuisé
      </label>
      <button type="button" id="actualiser">Actualiser</button>
    </div>
 
    <div class="tableau-conteneur">
      <table>
        <thead>
          <tr>
            <th>Référence</th>
            <th>Produit</th>
            <th class="nombre">Quantité</th>
            <th class="nombre">Seuil</th>
            <th>État</th>
          </tr>
        </thead>
        <tbody id="corps"></tbody>
      </table>
    </div>
    <p id="total"></p>

    <h2>Enregistrer un approvisionnement</h2>
    <form id="form-approvisionnement" class="formulaire-approvisionnement">
      <label>Identifiant fournisseur
        <input name="supplier_id" type="number" min="1" step="1" required>
      </label>
      <label>Identifiant produit
        <input name="product_id" type="number" min="1" step="1" required>
      </label>
      <label>Quantité
        <input name="quantity" type="number" min="1" step="1" required>
      </label>
      <label>Coût unitaire
        <input name="unit_cost" type="number" min="0" step="0.01" required>
      </label>
      <button type="submit">Enregistrer</button>
      <p id="resultat-approvisionnement" role="status" aria-live="polite"></p>
    </form>

    <h2>Mouvements récents</h2>
    <div class="tableau-conteneur">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Produit</th>
            <th>Type</th>
            <th class="nombre">Quantité</th>
            <th>Référence</th>
            <th>Note</th>
          </tr>
        </thead>
        <tbody id="corps-mouvements"></tbody>
      </table>
    </div>
    <p id="total-mouvements"></p>
  </main>
 
  <script>
    const LIBELLES = { OK: "Disponible", LOW: "Stock bas", OUT: "Rupture" };
    const corps = document.getElementById("corps");
    const total = document.getElementById("total");
    const corpsMouvements = document.getElementById("corps-mouvements");
    const totalMouvements = document.getElementById("total-mouvements");
    const filtre = document.getElementById("filtre-bas");
    const formulaireApprovisionnement = document.getElementById("form-approvisionnement");
    const resultatApprovisionnement = document.getElementById("resultat-approvisionnement");
    let lignes = [];
 
    function message(texte, estErreur) {
      corps.innerHTML = "";
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 5;
      td.className = "message" + (estErreur ? " erreur" : "");
      td.textContent = texte;
      tr.appendChild(td);
      corps.appendChild(tr);
    }
 
    function cellule(texte, classe) {
      const td = document.createElement("td");
      td.textContent = texte;
      if (classe) td.className = classe;
      return td;
    }
 
    function afficher() {
      const visibles = filtre.checked ? lignes.filter(l => l.status !== "OK") : lignes;
      if (visibles.length === 0) {
        message(filtre.checked ? "Aucun produit en stock bas." : "Aucun produit en stock pour le moment.", false);
        total.textContent = "";
        return;
      }
      corps.innerHTML = "";
      for (const l of visibles) {
        const tr = document.createElement("tr");
        tr.appendChild(cellule(l.sku));
        tr.appendChild(cellule(l.name));
        tr.appendChild(cellule(l.quantity, "nombre"));
        tr.appendChild(cellule(l.min_quantity, "nombre"));
 
        const tdEtat = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = "badge " + l.status;
        badge.textContent = LIBELLES[l.status] || l.status;
        tdEtat.appendChild(badge);
        tr.appendChild(tdEtat);
 
        corps.appendChild(tr);
      }
      total.textContent = visibles.length + " produit(s) affiché(s)";
    }
 
    async function charger() {
      message("Chargement…", false);
      total.textContent = "";
      try {
        const reponse = await fetch("/api/stock?limit=100");
        const json = await reponse.json();
        if (!reponse.ok) {
          const detail = json && json.error ? json.error.message : "Erreur " + reponse.status;
          message("Impossible de charger le stock : " + detail, true);
          return;
        }
        lignes = json.data;
        afficher();
      } catch (e) {
        message("Le serveur ne répond pas. Vérifiez que FastAPI est lancé, puis cliquez sur Actualiser.", true);
      }
    }

    async function chargerMouvements() {
      corpsMouvements.innerHTML = "";
      totalMouvements.textContent = "";
      const ligneChargement = document.createElement("tr");
      const celluleChargement = cellule("Chargement…");
      celluleChargement.colSpan = 6;
      celluleChargement.className = "message";
      ligneChargement.appendChild(celluleChargement);
      corpsMouvements.appendChild(ligneChargement);

      try {
        const reponse = await fetch("/api/stock/movements?limit=20");
        const json = await reponse.json();
        if (!reponse.ok) {
          throw new Error(json?.error?.message || "Erreur " + reponse.status);
        }

        corpsMouvements.innerHTML = "";
        if (json.data.length === 0) {
          const ligneVide = document.createElement("tr");
          const celluleVide = cellule("Aucun mouvement enregistré.");
          celluleVide.colSpan = 6;
          celluleVide.className = "message";
          ligneVide.appendChild(celluleVide);
          corpsMouvements.appendChild(ligneVide);
          return;
        }

        for (const mouvement of json.data) {
          const ligne = document.createElement("tr");
          ligne.appendChild(cellule(new Date(mouvement.created_at).toLocaleString()));
          ligne.appendChild(cellule(mouvement.product_id));
          ligne.appendChild(cellule(mouvement.movement_type));
          ligne.appendChild(cellule(mouvement.quantity, "nombre"));
          ligne.appendChild(cellule(mouvement.reference));
          ligne.appendChild(cellule(mouvement.note || "—"));
          corpsMouvements.appendChild(ligne);
        }
        totalMouvements.textContent = json.data.length + " mouvement(s) affiché(s)";
      } catch (e) {
        corpsMouvements.innerHTML = "";
        const ligneErreur = document.createElement("tr");
        const celluleErreur = cellule("Impossible de charger les mouvements : " + e.message);
        celluleErreur.colSpan = 6;
        celluleErreur.className = "message erreur";
        ligneErreur.appendChild(celluleErreur);
        corpsMouvements.appendChild(ligneErreur);
      }
    }
 
    filtre.addEventListener("change", afficher);
    document.getElementById("actualiser").addEventListener("click", () => {
      charger();
      chargerMouvements();
    });
    formulaireApprovisionnement.addEventListener("submit", async (event) => {
      event.preventDefault();
      const bouton = formulaireApprovisionnement.querySelector("button[type=submit]");
      const valeurs = new FormData(formulaireApprovisionnement);
      bouton.disabled = true;
      resultatApprovisionnement.textContent = "Enregistrement…";

      try {
        const reponse = await fetch("/api/stock/entries", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            supplier_id: Number(valeurs.get("supplier_id")),
            items: [{
              product_id: Number(valeurs.get("product_id")),
              quantity: Number(valeurs.get("quantity")),
              unit_cost: valeurs.get("unit_cost"),
            }],
          }),
        });
        const json = await reponse.json();
        if (!reponse.ok) {
          throw new Error(json?.error?.message || "Erreur " + reponse.status);
        }

        resultatApprovisionnement.textContent =
          "Approvisionnement " + json.reference + " enregistré.";
        formulaireApprovisionnement.reset();
        await Promise.all([charger(), chargerMouvements()]);
      } catch (e) {
        resultatApprovisionnement.textContent =
          "Impossible d’enregistrer l’approvisionnement : " + e.message;
      } finally {
        bouton.disabled = false;
      }
    });
    charger();
    chargerMouvements();
  </script>
</body>
</html>
