<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil · Gestion de stock</title>
  <style>
    :root {
      --fond: #f5f6f4;
      --surface: #ffffff;
      --texte: #1d2521;
      --texte-doux: #5b665f;
      --bordure: #d9dedb;
      --accent: #1f5e4b;
      --bas-fond: #fdf0d2;  --bas-texte: #7a5200;
      --rupture-fond: #f9dedc; --rupture-texte: #8c1f17;
      --ok-fond: #e1f1e8;   --ok-texte: #1b5a3a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #151a17;
        --surface: #1e2521;
        --texte: #e8ece9;
        --texte-doux: #9aa6a0;
        --bordure: #333d37;
        --accent: #6fc2a3;
        --bas-fond: #43350f;  --bas-texte: #f0cf7a;
        --rupture-fond: #4a1f1c; --rupture-texte: #f4a8a1;
        --ok-fond: #1d3a2b;   --ok-texte: #8fdbb2;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--fond);
      color: var(--texte);
      line-height: 1.5;
    }
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--bordure);
      padding: 0 1.5rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
      overflow-x: auto;
    }
    nav strong { padding: 1rem 0; white-space: nowrap; }
    nav a {
      color: var(--texte-doux);
      text-decoration: none;
      padding: 1rem 0;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    nav a:hover { color: var(--texte); }
    nav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.125rem; margin: 2rem 0 .75rem; }
    .sous-titre { color: var(--texte-doux); margin: 0 0 1.25rem; }
    .compteurs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin: 0;
    }
    .compteur {
      background: var(--surface);
      border: 1px solid var(--bordure);
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .compteur dt { color: var(--texte-doux); font-size: .875rem; }
    .compteur dd { margin: 0; font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .compteur a { color: inherit; text-decoration: none; display: block; }
    .compteur a:hover dd { color: var(--accent); }
    .compteur.attention dd { color: var(--bas-texte); }
    .compteur.critique dd { color: var(--rupture-texte); }
    .etat { padding: .75rem 1rem; border-radius: 6px; margin-top: 1rem; }
    .etat.ok { background: var(--ok-fond); color: var(--ok-texte); }
    .etat.bas { background: var(--bas-fond); color: var(--bas-texte); }
    .etat.rupture { background: var(--rupture-fond); color: var(--rupture-texte); }
    .etat a { color: inherit; font-weight: 600; }
    .erreur { color: var(--rupture-texte); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <nav>
    <strong>Gestion de stock</strong>
    <a href="/app/index.html" aria-current="page">Accueil</a>
    <a href="/app/products.html">Produits</a>
    <a href="/app/categories.html">Catégories</a>
    <a href="/app/suppliers.html">Fournisseurs</a>
    <a href="/app/stock.html">Stock</a>
    <a href="/app/sales.html">Ventes</a>
  </nav>
 
  <main>
    <h1>Tableau de bord</h1>
    <p class="sous-titre">Vue d'ensemble de l'activité et du stock.</p>
 
    <p id="erreur" class="erreur" role="alert" hidden></p>
 
    <dl class="compteurs">
      <div class="compteur"><dt>Produits</dt><dd id="produits">–</dd></div>
      <div class="compteur"><dt>Catégories</dt><dd id="categories">–</dd></div>
      <div class="compteur"><dt>Fournisseurs</dt><dd id="fournisseurs">–</dd></div>
      <div class="compteur">
        <a href="/app/sales.html"><dt>Ventes</dt><dd id="ventes">–</dd></a>
      </div>
    </dl>
 
    <h2>État du stock</h2>
    <dl class="compteurs">
      <div class="compteur"><dt>Unités en stock</dt><dd id="quantite">–</dd></div>
      <div class="compteur" id="carte-bas">
        <a href="/app/stock.html"><dt>Produits en stock bas</dt><dd id="bas">–</dd></a>
      </div>
      <div class="compteur" id="carte-rupture">
        <a href="/app/stock.html"><dt>Produits en rupture</dt><dd id="rupture">–</dd></a>
      </div>
    </dl>
 
    <div id="etat" class="etat" role="status" hidden></div>
  </main>
 
  <script>
    const texte = (id, valeur) => { document.getElementById(id).textContent = valeur; };
 
    function afficherEtat(bas, rupture) {
      const etat = document.getElementById("etat");
      etat.hidden = false;
      if (rupture > 0) {
        etat.className = "etat rupture";
        etat.innerHTML = "";
        etat.append(rupture + " produit(s) en rupture de stock. ");
        const a = document.createElement("a");
        a.href = "/app/stock.html";
        a.textContent = "Voir le stock";
        etat.appendChild(a);
      } else if (bas > 0) {
        etat.className = "etat bas";
        etat.innerHTML = "";
        etat.append(bas + " produit(s) sous leur seuil de réapprovisionnement. ");
        const a = document.createElement("a");
        a.href = "/app/stock.html";
        a.textContent = "Voir le stock";
        etat.appendChild(a);
      } else {
        etat.className = "etat ok";
        etat.textContent = "Tous les produits sont au-dessus de leur seuil.";
      }
    }
 
    async function charger() {
      const erreur = document.getElementById("erreur");
      try {
        const r = await fetch("/api/dashboard");
        const d = await r.json();
        if (!r.ok) throw new Error(d.error ? d.error.message : "Erreur " + r.status);
 
        texte("produits", d.products_count);
        texte("categories", d.categories_count);
        texte("fournisseurs", d.suppliers_count);
        texte("ventes", d.sales_count);
        texte("quantite", d.stock.total_quantity);
        texte("bas", d.stock.low_stock_count);
        texte("rupture", d.stock.out_of_stock_count);
 
        document.getElementById("carte-bas").classList.toggle("attention", d.stock.low_stock_count > 0);
        document.getElementById("carte-rupture").classList.toggle("critique", d.stock.out_of_stock_count > 0);
        afficherEtat(d.stock.low_stock_count, d.stock.out_of_stock_count);
      } catch (e) {
        erreur.hidden = false;
        erreur.textContent = "Impossible de charger le tableau de bord : " + e.message +
          ". Vérifiez que FastAPI est lancé, puis rechargez la page.";
      }
    }
 
    charger();
  </script>
</body>
</html>
