<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventes · Gestion de stock</title>
  <style>
    :root {
      --fond: #f5f6f4;
      --surface: #ffffff;
      --texte: #1d2521;
      --texte-doux: #5b665f;
      --bordure: #d9dedb;
      --accent: #1f5e4b;
      --ok-fond: #e1f1e8;   --ok-texte: #1b5a3a;
      --rupture-fond: #f9dedc; --rupture-texte: #8c1f17;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #151a17;
        --surface: #1e2521;
        --texte: #e8ece9;
        --texte-doux: #9aa6a0;
        --bordure: #333d37;
        --accent: #6fc2a3;
        --ok-fond: #1d3a2b;   --ok-texte: #8fdbb2;
        --rupture-fond: #4a1f1c; --rupture-texte: #f4a8a1;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--fond);
      color: var(--texte);
      line-height: 1.5;
    }
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--bordure);
      padding: 0 1.5rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
      overflow-x: auto;
    }
    nav strong { padding: 1rem 0; white-space: nowrap; }
    nav a {
      color: var(--texte-doux);
      text-decoration: none;
      padding: 1rem 0;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    nav a:hover { color: var(--texte); }
    nav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    .sous-titre { color: var(--texte-doux); margin: 0 0 1.25rem; }
    .carte {
      background: var(--surface);
      border: 1px solid var(--bordure);
      border-radius: 8px;
      padding: 1.25rem;
    }
    .ligne {
      display: grid;
      grid-template-columns: 1fr 7rem 7rem auto;
      gap: .75rem;
      align-items: end;
      margin-bottom: .75rem;
    }
    .ligne label { display: block; font-size: .875rem; color: var(--texte-doux); margin-bottom: .25rem; }
    select, input[type="number"] {
      width: 100%;
      font: inherit;
      color: var(--texte);
      background: var(--fond);
      border: 1px solid var(--bordure);
      border-radius: 6px;
      padding: .5rem .625rem;
    }
    .sous-total { padding: .5rem 0; text-align: right; font-variant-numeric: tabular-nums; }
    button {
      font: inherit; cursor: pointer;
      background: var(--accent); color: var(--surface);
      border: 0; border-radius: 6px; padding: .5rem 1rem;
    }
    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secondaire {
      background: transparent; color: var(--accent);
      border: 1px solid var(--accent);
    }
    button.retirer {
      background: transparent; color: var(--texte-doux);
      border: 1px solid var(--bordure);
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .pied {
      display: flex; flex-wrap: wrap; gap: 1rem;
      align-items: center; justify-content: space-between;
      margin-top: 1.25rem; padding-top: 1rem;
      border-top: 1px solid var(--bordure);
    }
    .total { font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .total small { font-weight: 400; color: var(--texte-doux); font-size: .875rem; }
    #message { margin-top: 1rem; }
    .alerte { padding: .75rem 1rem; border-radius: 6px; }
    .alerte.succes { background: var(--ok-fond); color: var(--ok-texte); }
    .alerte.erreur { background: var(--rupture-fond); color: var(--rupture-texte); }
    .alerte ul { margin: .5rem 0 0; padding-left: 1.25rem; }
    h2 { font-size: 1.25rem; margin: 2rem 0 .75rem; }
    .tableau-conteneur { background: var(--surface); border: 1px solid var(--bordure); border-radius: 8px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .75rem 1rem; text-align: left; border-bottom: 1px solid var(--bordure); vertical-align: top; }
    th { font-size: .875rem; color: var(--texte-doux); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    td.nombre, th.nombre { text-align: right; font-variant-numeric: tabular-nums; }
    td.vide { text-align: center; color: var(--texte-doux); padding: 1.5rem 1rem; }
    td.vide.erreur { color: var(--rupture-texte); }
    .articles { margin: 0; padding-left: 1.1rem; }
    .pagination { display: flex; gap: .75rem; align-items: center; justify-content: flex-end; margin-top: .75rem; color: var(--texte-doux); font-size: .875rem; }
    @media (max-width: 600px) {
      .ligne { grid-template-columns: 1fr 1fr; }
      .ligne .champ-produit { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <nav>
    <strong>Gestion de stock</strong>
    <a href="/app/index.html">Accueil</a>
    <a href="/app/products.html">Produits</a>
    <a href="/app/categories.html">Catégories</a>
    <a href="/app/suppliers.html">Fournisseurs</a>
    <a href="/app/stock.html">Stock</a>
    <a href="/app/sales.html" aria-current="page">Ventes</a>
  </nav>

  <main>
    <h1>Nouvelle vente</h1>
    <p class="sous-titre">Choisissez les produits vendus et leurs quantités.</p>

    <form class="carte" id="formulaire" novalidate>
      <div id="lignes"></div>
      <button type="button" class="secondaire" id="ajouter">Ajouter une ligne</button>

      <div class="pied">
        <div class="total">
          <small>Total estimé</small><br>
          <span id="total">0.00</span>
        </div>
        <button type="submit" id="valider">Enregistrer la vente</button>
      </div>

      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <h2>Historique des ventes</h2>
    <div class="tableau-conteneur">
      <table>
        <thead>
          <tr>
            <th>Référence</th>
            <th>Date</th>
            <th>Articles</th>
            <th class="nombre">Total</th>
          </tr>
        </thead>
        <tbody id="historique"></tbody>
      </table>
    </div>
    <div class="pagination">
      <button type="button" class="secondaire" id="precedent">Précédent</button>
      <span id="page-info"></span>
      <button type="button" class="secondaire" id="suivant">Suivant</button>
    </div>
  </main>

  <script>
    let produits = [];          // produits renvoyés par l'API
    const conteneur = document.getElementById("lignes");
    const message = document.getElementById("message");
    const totalEl = document.getElementById("total");
    const bouton = document.getElementById("valider");

    const parId = id => produits.find(p => p.id === Number(id));
    const montant = n => Number(n).toFixed(2);

    function afficherMessage(type, titre, details) {
      message.innerHTML = "";
      const div = document.createElement("div");
      div.className = "alerte " + type;
      const t = document.createElement("strong");
      t.textContent = titre;
      div.appendChild(t);
      if (details && details.length) {
        const ul = document.createElement("ul");
        for (const d of details) {
          const li = document.createElement("li");
          li.textContent = d;
          ul.appendChild(li);
        }
        div.appendChild(ul);
      }
      message.appendChild(div);
    }

    // ----- Lignes du formulaire -----
    function creerLigne() {
      const ligne = document.createElement("div");
      ligne.className = "ligne";
      ligne.innerHTML = `
        <div class="champ-produit">
          <label>Produit</label>
          <select class="produit"></select>
        </div>
        <div>
          <label>Quantité</label>
          <input type="number" class="quantite" min="1" step="1" value="1">
        </div>
        <div>
          <label>Sous-total</label>
          <div class="sous-total">0.00</div>
        </div>
        <button type="button" class="retirer" aria-label="Retirer cette ligne">Retirer</button>`;
      ligne.querySelector(".produit").addEventListener("change", rafraichir);
      ligne.querySelector(".quantite").addEventListener("input", rafraichir);
      ligne.querySelector(".retirer").addEventListener("click", () => {
        ligne.remove();
        if (!conteneur.children.length) conteneur.appendChild(creerLigne());
        rafraichir();
      });
      return ligne;
    }

    // Remplit les listes déroulantes : un produit déjà choisi sur une autre ligne est grisé.
    function rafraichir() {
      const lignes = [...conteneur.children];
      const choisis = lignes.map(l => l.querySelector(".produit").value);
      let total = 0;

      lignes.forEach((ligne, i) => {
        const select = ligne.querySelector(".produit");
        const valeur = select.value;
        select.innerHTML = "";

        const vide = new Option("Choisir un produit…", "");
        select.appendChild(vide);
        for (const p of produits) {
          const pris = choisis.some((c, j) => j !== i && c === String(p.id));
          const rupture = p.quantity <= 0;
          const texte = p.name + " — " + p.quantity + " en stock" + (rupture ? " (rupture)" : "");
          const opt = new Option(texte, String(p.id));
          opt.disabled = pris || rupture;
          select.appendChild(opt);
        }
        select.value = valeur;

        const p = parId(select.value);
        const qte = parseInt(ligne.querySelector(".quantite").value, 10) || 0;
        const sous = p ? parseFloat(p.sale_price) * qte : 0;
        ligne.querySelector(".sous-total").textContent = montant(sous);
        total += sous;
      });
      totalEl.textContent = montant(total);
    }

    // ----- Chargement des produits -----
    async function chargerProduits() {
      try {
        const r = await fetch("/api/products?limit=100");
        const json = await r.json();
        if (!r.ok) throw new Error(json.error ? json.error.message : "Erreur " + r.status);
        produits = json.data;
      } catch (e) {
        afficherMessage("erreur", "Impossible de charger les produits.", [e.message]);
        produits = [];
      }
      rafraichir();
    }

    // ----- Envoi de la vente -----
    function lireLignes() {
      const items = [];
      for (const ligne of conteneur.children) {
        const id = ligne.querySelector(".produit").value;
        const qte = parseInt(ligne.querySelector(".quantite").value, 10);
        if (!id) continue;
        items.push({ product_id: Number(id), quantity: qte });
      }
      return items;
    }

    async function enregistrer(evt) {
      evt.preventDefault();
      message.innerHTML = "";

      const items = lireLignes();
      if (items.length === 0) {
        afficherMessage("erreur", "Ajoutez au moins un produit à la vente.");
        return;
      }
      if (items.some(i => !Number.isInteger(i.quantity) || i.quantity < 1)) {
        afficherMessage("erreur", "Chaque quantité doit être un nombre entier supérieur à 0.");
        return;
      }

      bouton.disabled = true;
      try {
        const r = await fetch("/api/sales", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items })
        });
        const json = await r.json().catch(() => ({}));

        if (r.ok) {
          const vente = json.data || json;
          const total = vente.total_amount !== undefined ? vente.total_amount : totalEl.textContent;
          afficherMessage("succes", "Vente enregistrée.", [
            vente.reference ? "Référence : " + vente.reference : "",
            "Total : " + montant(total)
          ].filter(Boolean));
          conteneur.innerHTML = "";
          conteneur.appendChild(creerLigne());
          await chargerProduits();    // le stock a changé : on recharge les quantités
          await chargerHistorique(1); // la nouvelle vente apparaît en haut de l'historique
          return;
        }

        const erreur = json.error || {};
        if (r.status === 409 && Array.isArray(erreur.details)) {
          const details = erreur.details.map(d => {
            const p = parId(d.product_id);
            const nom = p ? p.name : "produit n°" + d.product_id;
            return "Stock insuffisant pour " + nom + " : " + d.requested + " demandé(s), " + d.available + " disponible(s).";
          });
          afficherMessage("erreur", "La vente n'a pas été enregistrée.", details);
          await chargerProduits();
        } else if (r.status === 400 && Array.isArray(erreur.details)) {
          afficherMessage("erreur", "Données invalides.", erreur.details.map(d => d.field + " : " + d.message));
        } else {
          afficherMessage("erreur", erreur.message || "Erreur " + r.status + ".");
        }
      } catch (e) {
        afficherMessage("erreur", "Le serveur ne répond pas.", ["Vérifiez que FastAPI est lancé, puis réessayez."]);
      } finally {
        bouton.disabled = false;
      }
    }

    // ----- Historique des ventes -----
    const LIMITE = 10;
    let pageCourante = 1;
    let totalVentes = 0;
    const corpsHisto = document.getElementById("historique");
    const btnPrecedent = document.getElementById("precedent");
    const btnSuivant = document.getElementById("suivant");
    const pageInfo = document.getElementById("page-info");

    function ligneVide(texte, estErreur) {
      corpsHisto.innerHTML = "";
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 4;
      td.className = "vide" + (estErreur ? " erreur" : "");
      td.textContent = texte;
      tr.appendChild(td);
      corpsHisto.appendChild(tr);
    }

    function cellule(texte, classe) {
      const td = document.createElement("td");
      td.textContent = texte;
      if (classe) td.className = classe;
      return td;
    }

    function formaterDate(iso) {
      const d = new Date(iso);
      return isNaN(d) ? iso : d.toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
    }

    async function chargerHistorique(page) {
      pageCourante = page || 1;
      try {
        const r = await fetch("/api/sales?page=" + pageCourante + "&limit=" + LIMITE);
        const json = await r.json();
        if (!r.ok) throw new Error(json.error ? json.error.message : "Erreur " + r.status);

        totalVentes = json.meta.total;
        if (json.data.length === 0) {
          ligneVide("Aucune vente enregistrée pour le moment.", false);
        } else {
          corpsHisto.innerHTML = "";
          for (const v of json.data) {
            const tr = document.createElement("tr");
            tr.appendChild(cellule(v.reference));
            tr.appendChild(cellule(formaterDate(v.created_at)));

            const tdArticles = document.createElement("td");
            const ul = document.createElement("ul");
            ul.className = "articles";
            for (const a of v.items) {
              const li = document.createElement("li");
              li.textContent = a.quantity + " × " + a.product_name;
              ul.appendChild(li);
            }
            tdArticles.appendChild(ul);
            tr.appendChild(tdArticles);

            tr.appendChild(cellule(montant(v.total_amount), "nombre"));
            corpsHisto.appendChild(tr);
          }
        }
        const pages = Math.max(1, Math.ceil(totalVentes / LIMITE));
        pageInfo.textContent = "Page " + pageCourante + " sur " + pages + " · " + totalVentes + " vente(s)";
        btnPrecedent.disabled = pageCourante <= 1;
        btnSuivant.disabled = pageCourante >= pages;
      } catch (e) {
        ligneVide("Impossible de charger l'historique : " + e.message, true);
        btnPrecedent.disabled = true;
        btnSuivant.disabled = true;
      }
    }

    btnPrecedent.addEventListener("click", () => chargerHistorique(pageCourante - 1));
    btnSuivant.addEventListener("click", () => chargerHistorique(pageCourante + 1));

    document.getElementById("ajouter").addEventListener("click", () => {
      conteneur.appendChild(creerLigne());
      rafraichir();
    });
    document.getElementById("formulaire").addEventListener("submit", enregistrer);

    conteneur.appendChild(creerLigne());
    chargerProduits();
    chargerHistorique(1);
  </script>
</body>
</html>
